<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page not found | Deepika Dubey</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="/DeepikaDubey_ProductPortfolio/ProfilePhoto.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap">
  <!-- Deliberately self-contained. The main stylesheets are mid-refactor, and
       an error page should not be able to break because of that work. -->
  <style>
    :root {
      --paper: #f3eee4;
      --ink: #1a1713;
      --muted: #6b645b;
      --accent: #2457d6;
      --spin: #c45c26;
      --line: rgba(26, 23, 19, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14120f;
        --ink: #f3eee4;
        --muted: #a29a8e;
        --accent: #7d9bff;
        --spin: #f0c36a;
        --line: rgba(243, 238, 228, 0.16);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 34rem) auto;
      gap: 4.5rem;
      align-items: center;
    }

    /* She is in the same arched window as on the story cover, thinking
       about where the page went, and answers whichever link you reach for. */
    .lost {
      position: relative;
      padding-top: 4.2rem;
    }

    .window {
      width: 11rem;
      padding: 6px;
      border: 1.5px solid var(--spin);
      border-radius: 999px 999px 0.8rem 0.8rem;
      box-shadow:
        0 0 0 7px color-mix(in srgb, var(--spin) 9%, transparent),
        0 26px 44px rgba(0, 0, 0, 0.16);
    }

    .pane {
      position: relative;
      height: 13.2rem;
      overflow: hidden;
      border-radius: 999px 999px 0.5rem 0.5rem;
      background:
        radial-gradient(70% 55% at 50% 40%, color-mix(in srgb, var(--spin) 30%, transparent), transparent 75%),
        color-mix(in srgb, var(--spin) 10%, var(--paper));
    }

    .art {
      position: absolute;
      left: -10%;
      top: 11%;
      width: 120%;
      aspect-ratio: 680 / 800;
      background: url('/DeepikaDubey_ProductPortfolio/mascots/deepika-reactions.webp') no-repeat;
      background-size: 300% 300%;
      background-position: 50% 100%;
    }

    .cloud {
      position: absolute;
      top: 0;
      left: 55%;
      white-space: nowrap;
      margin: 0;
      padding: 0.55rem 0.9rem;
      border: 1.5px solid var(--ink);
      border-radius: 1.2rem;
      background: var(--paper);
      font-family: 'Fraunces', Georgia, serif;
      font-size: 0.95rem;
      font-style: italic;
      line-height: 1.3;
      color: var(--ink);
      rotate: 2deg;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
    }

    .cloud::before {
      left: 0.6rem;
      bottom: -0.75rem;
      width: 0.55rem;
      height: 0.55rem;
    }

    .cloud::after {
      left: 0.1rem;
      bottom: -1.3rem;
      width: 0.32rem;
      height: 0.32rem;
    }

    .cloud-text {
      display: block;
      transition: opacity 0.18s ease;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        gap: 2.2rem;
      }

      .lost {
        order: -1;
        padding-top: 3.8rem;
      }

      .window {
        width: 8.4rem;
      }

      .cloud {
        left: 6.6rem;
        top: 0.8rem;
        font-size: 0.88rem;
      }

      .pane {
        height: 10rem;
      }
    }

    .label {
      margin: 0 0 1.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 1rem;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.5rem, 8vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 2rem;
      font-size: 1.0625rem;
      line-height: 1.65;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      align-items: center;
      padding-top: 1.75rem;
      border-top: 1px solid var(--line);
    }

    a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    a:hover,
    a:focus-visible {
      color: var(--accent);
      border-color: currentColor;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="label">Error 404</p>
      <h1>This page shipped without a URL.</h1>
      <p>
        Which is a polite way of saying it isn't here. The link may be old, or I
        may have moved something. Either way, the work is still one click away.
      </p>
      <div class="links">
        <a href="/DeepikaDubey_ProductPortfolio/" data-face="100% 0%" data-say="yes! that way">Back to the portfolio</a>
        <a href="/DeepikaDubey_ProductPortfolio/my-story.html" data-face="50% 50%" data-say="ooh, the long version">Read my story</a>
        <a href="mailto:dubeydeepika1209@gmail.com" data-face="50% 0%" data-say="say hi, I reply">Email me</a>
      </div>
    </div>
    <div class="lost" aria-hidden="true">
      <p class="cloud"><span class="cloud-text">hmm… where did it go?</span></p>
      <div class="window"><div class="pane"><i class="art"></i><i class="art" style="opacity:0"></i></div></div>
    </div>
  </main>
  <script>
    (function () {
      var arts = document.querySelectorAll('.art');
      var pane = document.querySelector('.pane');
      var front = arts[0];
      var back = arts[1];
      var text = document.querySelector('.cloud-text');
      var idle = { face: '50% 100%', say: text.textContent };
      var swap = 0;
      var settle = 0;
      // The new face fades in over the old one, which is hidden once covered;
      // swapping one picture's position made her face jump.
      function showFace(face) {
        if (front.style.backgroundPosition === face) return;
        clearTimeout(settle);
        back.style.transition = 'none';
        back.style.opacity = '0';
        back.style.backgroundPosition = face;
        pane.appendChild(back);
        void back.offsetWidth;
        back.style.transition = 'opacity 0.2s ease';
        back.style.opacity = '1';
        var old = front;
        settle = setTimeout(function () {
          old.style.transition = 'none';
          old.style.opacity = '0';
        }, 220);
        front = back;
        back = old;
      }
      front.style.backgroundPosition = idle.face;
      function show(face, say) {
        showFace(face);
        clearTimeout(swap);
        text.style.opacity = '0';
        swap = setTimeout(function () {
          text.textContent = say;
          text.style.opacity = '1';
        }, 140);
      }
      document.querySelectorAll('.links a').forEach(function (a) {
        function on() { show(a.dataset.face, a.dataset.say); }
        function off() { show(idle.face, idle.say); }
        a.addEventListener('mouseenter', on);
        a.addEventListener('focus', on);
        a.addEventListener('mouseleave', off);
        a.addEventListener('blur', off);
      });
    })();
  </script>
</body>
</html>
